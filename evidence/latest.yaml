  - "NVIDIA の棚卸資産 US$39.7B（QoQ +25.8%、推定在庫日数 約124日）は M4 と反転リスク『在庫増』の両方に関係"
  - "テキサスは TCEQ が通常の許可審査に戻り（報道2本、11/17〜18）、ERCOT の大口接続の扱いは未確認で、texas_pause.state は継続から条件付き再開に変わった。A4 と予測 F2026-11-06-2 に関係"
  - "ニューヨーク州の50MW以上のDCの新規許可の1年停止（2026-07-14）を今回確認し、停止・新規制の州の数の数え方が1から2になった（新しい措置ではない）。反転リスク『米国内のDC規制・許認可』の材料"
  - "BIS の暫定最終規則（11/16 公表）は、海外DCの中国系企業向け遠隔提供、東南アジア4か国とブラジル向けの AIチップ、ファウンドリー・OSAT の顧客審査の3つに及び、X3 と NVIDIA の中国ゼロ前提の両方に関係"
  - "SemiAnalysis の AIアクセラレーター設備投資の推計引き下げ（2028年 −28%、報道）は第三者の推計で、4社の CapEx ガイダンス（US$720B〜740B）は今週変わっていない"
  - "ASML の『2027・2028年の計画供給は需要を完全には満たさない』と4Q26 ガイダンス EUR 14.2B〜15.2B は F2 に関係し、装置大手の見通しの引き下げは今週0社"
  - "TrendForce の公開の新しい価格発表は4週連続で見つからず、M1 の数値は9/30 の4Q26 予測（DRAM +10〜15%、NAND +15〜20%）のまま。台湾の報道は『4Q の値上げ幅は縮小、2027年のギャップは拡大の可能性』"
  - "Nanya・Winbond の10月売上は報道の本数が増え金額が一致し、台湾2社の株価は 11/14〜11/20 に7日続落した"
  - "米10月PPI は BLS で前年比 +6.5%・コア +5.0% を確認し、FOMC 議事要旨（ほぼすべての参加者が追加利上げを適切と判断、次回は 12/8〜9）と Waller・Cook 理事の発言（報道）と合わせて X2 と予測 F2026-11-13-2 に関係。10年金利 ^TNX は 11/20 に 4.912% へ下がった"
  - "FOMC 議事要旨は AI 関連の債務の急増、AI 関連株の評価の低下、DC 建設資金のハイイールド債のスプレッド拡大に言及し、反転リスク『AI投資の資金調達・信用』に関係"
  - "HY スプレッドは 3.52%（21本 +0.25pt）、CCC は 13.61%（+0.54pt）へ広がり、CRWV・ORCL・NVDA の CDS は今週の値が取れていない。Anthropic の上場（約 US$813億）は AI 投資の資金調達の材料"
  - "SKHY のプレミアムは 25.26% で 20日平均 43.18% を下回り、うち一部は KRX と米国の取引時間のずれによる"

