IMPLICATIONS:
  - "4社の3Q26設備投資合計（現金ベースUS$201.9B、+107.6% YoY）が4社とも10-Qで一致したことは、A1の『実績』側の確度を上げ、2026年ガイダンス合計（US$720〜740B、7月比で上限−5B）はMSFTの約170Bがtier4のままという区別になる"
  - "MSFTの『第三者からの容量引き渡しの遅れ』による暦年2026年の引き下げ（tier4）と未開始リースUS$364.6Bは、A4（稼働タイミング）とA1の両方に関係し、金額の減少ではなく時期の後ろ倒しの事例"
  - "Alphabetの3Q資金調達（負債約US$29.0B、普通株US$12.4B、FCF −US$9.1B）、Amazonの3Q長期債務調達US$48.1B、Metaの9か月負債US$24.9Bと増資、Oracleの11/2 US$200億は、反転リスク『AI投資の資金調達・信用』の材料（件数は増加、条件の悪化は未確認）"
  - "AMDのデータセンター売上+97%と4Qガイダンス+27% QoQは、A2とHBM需要（M2）の両方に関係。株価は好決算に反応せず11/5に−17%"
  - "Qualcommのスマホ向け−26%と『メモリーの不足と値上がりがスマホ需要を弱めるおそれ』（報道）は、M2（川下の数量）とM4（在庫）に関係し、メモリー価格の上昇が買い手側の需要に効き始めた事例（7月時点から継続）"
  - "Kioxiaの3Q営業利益ガイダンス約2兆円（予想比−14.9%）は出荷時期の説明で、来年分完売の発言はM5に、ガイダンス未達はE1に関係"
  - "Nanyaの10月売上+487.7% YoY・4Q ASP上昇余地・契約期間延長の要望は、legacy DRAM（M1）とM5に関係。株価は11/3ストップ安"
  - "テキサスの停止措置は8〜9月から継続しており、11/5の選挙で変わったのは解除時期と条件の見通し（次期知事の発言）。公式の新措置・PUCT/ERCOT決定はなく、連邦は下院可決済みの拘束力のない法案と提出段階のモラトリアム法案"
  - "IRENのHorizon 1（50MW）はMicrosoftに引き渡し済み（8/13）、Horizon 2〜4は2026年中の予定で、11月の更新は未確認。CRWVの11/10決算が案件進捗の最初の確認機会"
  - "TrendForceの新しい契約価格発表（4Q26実績、1Q27予測）は2週連続で見つからず、M1とTHESIS_INVALIDATION(2)の判定材料は9/30の予測のまま"
  - "メモリー株は11/5にMU −17.5%・SNDK −22.3%、韓国・日本・台湾は11/6に−4.6〜−10.4%で、市況の一次情報（契約価格上昇の継続、完売）と株価の乖離はさらに広がった"
  - "SKHYプレミアム52.6%は原株の1日遅れの急落で広がった計算上の値で、11/9の原株で縮む見込み。11/5は31.4%で別枠トリガー（30%割れ）に1.4ptまで接近していた"
  - "SOXXの3対1分割（11/5）とSanDiskの8対1分割（11/19）は、価格データと週次LEVELSの水準の読み替えに関係"

