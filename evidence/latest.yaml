      scope:
        - "TCEQ許認可：知事書簡（2026-09-21）で『データセンターが求めるすべての許可を止め（halt all permits sought by data centers）』『ERCOTの審査が終わるまでデータセンター案件に関するすべての許可の発行を一時停止』。新規・審査中の案件が対象。MW閾値や自家発電・ERCOT域外の例外は明記なし。既存許可・建設中・稼働済み敷地での増設の扱いは書簡に明記なし（法律事務所も未言及）。更新・変更申請の扱いは不明で書面確認を推奨（Beveridge & Diamond）"
