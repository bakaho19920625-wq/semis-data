DC_TIMING:
  regulation:
    texas_pause:
      state: 条件付き再開
      state_note: "前回と同じ『条件付き再開』。TCEQ（州環境当局）の許可審査は再開（Gibson Dunn の 11/18 の更新『resumed its permit review processing』、11/16 に DC とガス火力の大気の許可を発行）。一方で ERCOT は検証と審査が終わるまで新しい大口負荷（Large Load）の DC の受電（energize）の承認を止めている（『paused approvals to energize new Large Load data centers』、中規模負荷 25MW〜75MW未満は対象外）。前回『ERCOT の大口接続は未確認』だった点が、法律事務所の解説で『受電承認は停止中』と分かった"
      scope:
        - "ERCOT大口接続：新しい Large Load の DC の受電承認を停止（検証〔Batch Zero Eligibility Verification〕と地域影響の審査が終わるまで）。25MW〜75MW未満の中規模負荷は除外。9月初めに 204案件（66.4GW）を base load、158案件（127.9GW）を studied load に条件付きで分類（検証が条件）。Batch Zero の検討の期限 2027-04-09（PGRR 145）に ERCOT は『間に合わない』と表明、延長が見込まれる（代替期限は未提示）"
        - "TCEQ許認可：審査を再開（11/18 の更新）。知事の指示（2026-09-21）は ERCOT の監査完了まで DC の許可を出さないよう TCEQ に指示したもので『固定の終了日はない』。停止は系統接続のない案件の大気・雨水・水の許可にも及んだため、保留中の案件は TCEQ に直接確認するよう助言"
        - "その他：TWDB の水使用報告（前回まで）。州議会では DC の売上税免除の廃止、水使用の開示、地方の税優遇の禁止の法案（SB 35・SB 36 ほか）が事前提出済み（11/9 から事前提出）"
