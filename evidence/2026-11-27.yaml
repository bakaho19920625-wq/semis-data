IMPLICATIONS:
  - "TrendForce は 11/19 に 4Q26 の NAND 契約価格の予測を +15〜20% から +8〜13% に下げ、1Q27 を −0〜5%、2Q27 から全製品で下落と予測した。M1 と製品別価格の反転リスクに関係"
  - "TrendForce の 11/27 のリリースは conventional DRAM の上げ幅が2027年を通じて縮小し 2H27 に横ばい、2028年に下落（bear case では 4Q27 から下落）とし、1Q27 の DRAM の数値予測は公開されていない。前提が崩れる条件(2)（1Q27 DRAM 予測がマイナス）は数値が未公表のまま"
  - "TrendForce は中国 CSP の 2027年の enterprise SSD・server DRAM の調達削減と北米 CSP の吸収・見通しの引き上げを同時に記載しており、M2・A1 と反転リスク『AI CapEx鈍化』の両方に関係"
  - "TrendForce の 2027年売上予測（DRAM +69%、NAND +29%）は引き下げ後の値で、旧値は発表文にない"
  - "NAND スポットは 11/17 の TrendForce News で2週間 −20%、512Gb TLC wafer は3週で −23.3%（二次記事の転載）で、契約価格予測の引き下げより先に動いた"
  - "テキサスは TCEQ の審査再開と ERCOT の新しい大口負荷の受電承認の停止が同時に続いており、texas_pause.state は条件付き再開のまま。A4・A5 と予測 F2026-11-06-2 に関係"
  - "ERCOT の Batch Zero は 9月初めに 204案件・66.4GW を base load、158案件・127.9GW を studied load に条件付きで分類し、2027-04-09 の期限は延長の見込みで、A5 の受電待ちの案件数に関係"
  - "IREN の Q1 FY27 決算は見出しで年率売上の目標時期が1月にずれ、設備投資を資金面から削ったとされるが、案件別のずれの月数は本文未取得で、projects の shift_months は unconfirmed のまま"
  - "ADI の FQ1 ガイダンス中央値は FQ4 比 +0.6%、棚卸資産は前年比 +25.8% で、E1 と反転リスク『在庫増』に関係"
  - "BIS 暫定最終規則は 11/19 の公示で発効の予定（法律事務所の解説2本）で、既存の DC は90日以内に許可の取得が必要。X3 と、TrendForce が DRAM 需要のリスクに挙げた項目の両方に関係"
  - "中国のガリウム・ゲルマニウム・アンチモンの対米禁輸の停止措置は 11/27 が期限で、延長・失効の公式発表は見つかっておらず、X3 に関係"
  - "米10月PCE はコア前年比 +3.3%（BEA）、12月 FOMC の0.25pt 利上げは完全に織り込み（報道）で、X1・X2 と予測 F2026-11-13-2 に関係。DFII10 は 11/25 に 2.73%（5本 −0.15pt）"
  - "HY スプレッドは 3.77%（21本 +0.63pt）、CCC は 14.17%（+1.10pt）へ広がり、CRWV・ORCL・NVDA の CDS は3週続けて今週の値が取れていない。反転リスク『AI投資の資金調達・信用』に関係"
  - "SKHY のプレミアムは 43.51% で20日平均 42.69% とほぼ同じ水準に戻り、11/26 の米国休場で ADS と原株の日数がずれている"
