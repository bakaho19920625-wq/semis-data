- SOXが終値で7月安値10,447を上回った（11/11終値10,564.11、+1.1%上、+5.66%）。上げの引き金の価格の第一段階（5営業日維持）の1日目。下方トリガーの価格条件「10,447割れ」は11/4〜11/10の5日連続の後に途切れた。SMA200 10,864.08まで+2.8%、半導体SMA50上比率 14.3%→23.8%（30%超が条件）。S 11.2→16.2、D 15.0→17.5、TECHNICAL 12.3→16.6
- CoreWeave 3Q26（11/10引け後、TheStreet報道・一次未確認）：売上37億ドル（+168%）、純損失7.09億ドル、2026年通期ガイダンス 売上130〜133億ドル・調整後営業利益12.75〜13.75億ドル（予想128.6億・10.7億ドルを上回る）、一部社債の利回り16%超。受電・引き渡し・課金開始の日付は未確認 → DC_TIMING・F2026-11-06-1・反転リスク「AI投資の資金調達・信用」の材料。CRWV +24.71%（出来高20日平均の2.16倍）
- 米10月CPI（11/10）は予想より強いと報道、12月の0.25pt利上げはほぼ織り込み（TheStreet、数値未確認）→ X2
- NVDAの2日続落の理由（報道）：CEOをめぐる報道を受けた外部法律事務所の調査と取締役会の独立調査、Bairdの中立への格下げ・目標株価引き下げ、Morgan Stanleyのトップピック除外（強気は維持）。11/11は+2.87%（出来高1.75倍）、20日安値165.89まで−4.5% → A2（決算11/17）の前の個別要因
- SOXXが取得失敗（11/11の値が欠け、11/10の146.59のまま）。危険の目安・底の目安・帯は判定できず、D2 −2→−1と次の候補へのAMD・TSM・ENTGの追加は見かけの可能性（米国株側のSOXXで計算した次の候補はADI・TXN・MPWR・SWKS・SNPS）。週次でSOXXが入った後の値を確かめる
- 米国株側：半導体の先導株 0→3（ADI・AMD・SWKS、4週前3）、テック4（4週前15）。ナスダック総合にFTD（11/11）、レジームはCのまま。テック内部 −20%以上 67.3%→62.2%（broad_decline・IX3 on は不変）
