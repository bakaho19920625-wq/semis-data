review_candidates:
- 下方トリガーの価格条件が全部成立（SOX終値10,328.33＜7月安値10,447。SMA200割れは10/30）。ファンダ条件（KLA・ASML・AMATのWFE、TrendForce、CapEx引き下げ）は未成立。S 7.5・D 12.5・TECHNICAL 9.0に低下
- Kioxia：12月期の営業利益見通し2兆円が予想未達（9月期1.99兆円とほぼ同水準、報道）。CFOは出荷時期の前倒し・後ずれが主因、来年の計画生産分は完売と説明（一次未確認）。東京で−15.8%、米メモリー株が連れ安。M2・M4・E1の採点と、決算日（週次では11月中旬としていた）の訂正
- 反転リスク「AI CapEx鈍化・収益化失望」の内訳「資金調達・信用」：Oracleが100億ドルの新株発行＋約100億ドルの社債発行（424B2、ORCL −8.8%）
- X4（地政学）：ブレント −7.63%の104.77ドル（米イラン協議の期待、報道）。10/30の117.64ドルから大きく低下。一次未確認
- D5：SKHYプレミアム40.8%→33.0%（原株+3.8%、ADS −1.0%）。別枠の下方トリガー（30%割れ）まで3.0pt
