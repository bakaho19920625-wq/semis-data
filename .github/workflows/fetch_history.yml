# 長期検証用：最長の日足を1回だけ取得し、Artifact と「history」ブランチに置く（手動実行のみ。毎日の update とは別）
name: fetch-history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - name: Fetch max history
        run: |
          mkdir -p hist_out
          python history/fetch_history.py history/tickers_history.txt hist_out
      - uses: actions/upload-artifact@v4
        with:
          name: prices_max
          path: hist_out
          retention-days: 30
      - name: Publish to history branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd hist_out
          git init -q && git checkout -q -b history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" history
