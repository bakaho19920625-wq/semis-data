# 半導体・メモリー定点観測用のデータを毎日取得し、「data」ブランチに保存する
# 失敗したステップがあっても、前回のファイルを残したまま run_status.json に結果を記録する
name: update-semis-data

on:
  schedule:
    # 実績（2026-10-27〜31）に合わせた時刻。Yahooは米国東部 20:30〜21:20 ごろ（日本時間 10:30〜11:20、夏時間は1時間早い）に
    # 全銘柄の終値を一時的に空欄で返す。以前の予約（UTC 21:47・22:47）はGitHubの遅れでこの時間帯に動き、前日のままになっていた。
    # (1) 引け直後（日本 6:35）、(2) 空欄の時間帯の後（日本 12:35）の2回にし、各回は「前営業日の足が入るまで10分おきに最大6回取り直す」。
    # 日次レポート（火〜土 8:53 JST）はデータが古ければ自分で手動起動する（prompts/daily.md 手順1）。
    - cron: "35 21 * * 1-5"
    - cron: "35 3 * * 2-6"
  workflow_dispatch: # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write

concurrency:
  group: update-semis-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # 前回のdataブランチの中身を out/ に戻す。今回失敗したファイルは前回のまま残る
      - name: Restore previous data
        run: |
          mkdir -p out
          if git fetch -q --depth 1 origin data; then
            git archive --format=tar FETCH_HEAD | tar -x -C out
            echo "restored previous data branch"
          else
            echo "no previous data branch (first run)"
          fi

      - id: prices
        name: Fetch prices (Yahoo)
        continue-on-error: true
        # 前営業日（東部16:20を過ぎた直近の平日）の足が入るまで、10分おきに最大6回取り直す（Yahooの終値空欄の時間帯への対策）。
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          def expected_session():
              now = datetime.now(ZoneInfo("America/New_York"))
              d = now.date()
              if now.hour * 60 + now.minute < 16 * 60 + 20:
                  d -= timedelta(days=1)
              while d.weekday() >= 5:
                  d -= timedelta(days=1)
              return d.isoformat()
          want = expected_session()
          rc = 0
          for attempt in range(1, 7):
              rc = subprocess.run([sys.executable, "fetch_prices.py", "--out", "out"]).returncode
              got = None
              if os.path.exists("out/semis_manifest.json"):
                  got = json.load(open("out/semis_manifest.json")).get("us_as_of")
              print(f"attempt {attempt}: rc={rc} us_as_of={got} expected={want}", flush=True)
              if (rc == 0 and got and got >= want) or attempt == 6:
                  if not (got and got >= want):
                      print("::warning::前営業日の足がまだ入っていません（Yahoo未確定か休場日）。前回までの足で進みます。")
                  break
              time.sleep(600)
          sys.exit(rc)
          PY

      - id: macro
        name: Fetch macro (FRED)
        continue-on-error: true
        run: python fetch_macro.py --out out

      - id: snapshot
        name: Build snapshot and levels
        continue-on-error: true
        run: python build_snapshot.py --out out

      - id: signals
        name: Build daily signals
        continue-on-error: true
        run: python build_signals.py --out out

      - name: Write run status
        env:
          PRICES: ${{ steps.prices.outcome }}
          MACRO: ${{ steps.macro.outcome }}
          SNAPSHOT: ${{ steps.snapshot.outcome }}
          SIGNALS: ${{ steps.signals.outcome }}
        run: |
          python - <<'EOF'
          import json, os
          from datetime import datetime, timezone
          s = {
            "run_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "steps": {"prices": os.environ["PRICES"], "macro": os.environ["MACRO"], "snapshot": os.environ["SNAPSHOT"], "signals": os.environ["SIGNALS"]},
            "note": "failure のステップの出力ファイルは前回のまま。semis_manifest.json の us_as_of で日付を確認すること",
          }
          json.dump(s, open("out/run_status.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(s, ensure_ascii=False, indent=2))
          EOF

      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf .git
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # 価格取得が失敗した日は、保存はしたうえでジョブを失敗にして通知メールが届くようにする
      - name: Fail job if prices step failed
        if: steps.prices.outcome == 'failure'
        run: |
          echo "価格の取得に失敗しました。dataブランチは前回の内容のままです。"
          exit 1
